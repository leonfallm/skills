<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Harbor · Team portal</title>
<!-- A made-up web app to try the skill on: a sign-in that is remembered (localStorage), pages, a form,
     a list that scrolls and a toast. Open it with:  node scripts/browser.mjs open --dir <video-dir> --url file://<this file> -->
<meta name="theme-color" content="#0E7C66">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1B2420;background:#F4F6F5}
button,input,select{font:inherit;color:inherit}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid #CBD5D0;background:#fff;cursor:pointer;font-weight:550;transition:background .12s}
.btn:hover{background:#EEF2F0}
.btn.primary{background:#0E7C66;border-color:#0E7C66;color:#fff}.btn.primary:hover{background:#0A6352}
input[type=text],input[type=email],select{height:40px;width:100%;border:1px solid #CBD5D0;border-radius:8px;padding:0 12px;background:#fff}
input:focus,select:focus{outline:2px solid #0E7C66;outline-offset:-1px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#3D4A45}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F4F6F5}
#login form{width:380px;background:#fff;border:1px solid #DDE4E0;border-radius:16px;padding:32px}
#login h1{font-size:22px;margin-bottom:6px}#login p{color:#63716B;margin-bottom:22px}
#app{display:none;height:100vh}
aside{position:fixed;left:0;top:0;bottom:0;width:232px;background:#fff;border-right:1px solid #DDE4E0;padding:20px 12px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;padding:0 10px 18px;color:#0E7C66}
aside a{display:block;padding:8px 10px;border-radius:8px;color:#3D4A45;text-decoration:none;font-weight:550;margin-bottom:2px}
aside a:hover{background:#EEF2F0}aside a.on{background:#E3F1ED;color:#0A6352}
.who{position:absolute;left:12px;right:12px;bottom:16px;padding:10px;border-top:1px solid #DDE4E0;font-size:13px;color:#63716B}
main{margin-left:232px;height:100vh;overflow:auto;padding:36px 48px 80px}
h2{font-size:26px;letter-spacing:-.02em;margin-bottom:4px}.sub{color:#63716B;margin-bottom:24px}
.card{background:#fff;border:1px solid #DDE4E0;border-radius:14px;padding:22px;margin-bottom:18px;max-width:880px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:880px;margin-bottom:18px}
.tile{background:#fff;border:1px solid #DDE4E0;border-radius:14px;padding:18px}.tile b{display:block;font-size:26px;letter-spacing:-.02em}
.tile span{font-size:13px;color:#63716B}
.row{display:flex;gap:14px;margin-bottom:14px}.row>div{flex:1}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#63716B;padding:8px 0;border-bottom:1px solid #DDE4E0}
td{padding:11px 0;border-bottom:1px solid #EEF2F0}.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:#E3F1ED;color:#0A6352}
.pill.inv{background:#FFF1D6;color:#8A5A00}
#toast{position:fixed;right:24px;bottom:24px;background:#1B2420;color:#fff;padding:12px 18px;border-radius:10px;font-weight:550;display:none}
.check{display:flex;align-items:center;gap:8px;margin:4px 0 16px;font-weight:500;font-size:14px;color:#1B2420}
.check input{width:16px;height:16px;accent-color:#0E7C66}
</style></head><body>
<div id="login"><form onsubmit="return signIn(event)">
  <h1>Sign in to Harbor</h1><p>Use any work e-mail. This is a demo.</p>
  <label for="email">Work e-mail</label><input id="email" type="email" placeholder="you@company.com" required style="margin-bottom:16px">
  <button class="btn primary" style="width:100%;height:40px">Continue</button>
</form></div>

<div id="app">
  <aside>
    <div class="logo">Harbor</div>
    <a href="#/overview" data-p="overview">Overview</a>
    <a href="#/team" data-p="team">Team</a>
    <a href="#/billing" data-p="billing">Billing</a>
    <a href="#/settings" data-p="settings">Settings</a>
    <div class="who"><span id="who"></span><br><a href="#" onclick="signOut()" style="display:inline;padding:0;color:#0E7C66">Sign out</a></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
const S = JSON.parse(localStorage.getItem('harbor') || 'null') || { user: null, team: [
  { n: 'Ingrid Solheim', e: 'ingrid@northwind.example', r: 'Owner', s: 'Active' },
  { n: 'Tomás Rivera', e: 'tomas@northwind.example', r: 'Admin', s: 'Active' },
  { n: 'Aiko Tanaka', e: 'aiko@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Jonas Berg', e: 'jonas@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Priya Nair', e: 'priya@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Luca Moretti', e: 'luca@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Sara Lindholm', e: 'sara@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Omar Haddad', e: 'omar@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Elin Dahl', e: 'elin@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Mateo Cruz', e: 'mateo@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Hanna Virtanen', e: 'hanna@northwind.example', r: 'Member', s: 'Active' },
  { n: 'Noah Fischer', e: 'noah@northwind.example', r: 'Member', s: 'Active' } ] };
const save = () => localStorage.setItem('harbor', JSON.stringify(S));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function signIn(e) { e.preventDefault(); S.user = document.getElementById('email').value; save(); location.hash = '#/overview'; boot(); return false; }
function signOut() { S.user = null; save(); location.hash = ''; boot(); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 4000); }
const pages = {
  overview: () => `<h2>Overview</h2><p class="sub">Northwind Logistics</p>
    <div class="tiles"><div class="tile"><b>${S.team.length}</b><span>people in the team</span></div><div class="tile"><b>${S.team.filter(m => m.s === 'Invited').length}</b><span>open invitations</span></div><div class="tile"><b>Team plan</b><span>renews 1 March</span></div></div>
    <div class="card"><b>Getting started</b><p style="color:#63716B;margin-top:6px">Invite your colleagues under Team. Each person gets an e-mail with a link.</p></div>`,
  team: () => `<h2>Team</h2><p class="sub">Who has access to Harbor.</p>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>${S.team.length} people</b><button class="btn primary" id="inviteBtn" onclick="location.hash='#/team/invite'">Invite a colleague</button></div>
    <table><tr><th>Name</th><th>E-mail</th><th>Role</th><th>Status</th></tr>${S.team.map(m => `<tr><td>${esc(m.n)}</td><td>${esc(m.e)}</td><td>${esc(m.r)}</td><td><span class="pill ${m.s === 'Invited' ? 'inv' : ''}">${m.s}</span></td></tr>`).join('')}</table></div>`,
  'team/invite': () => `<h2>Invite a colleague</h2><p class="sub">They get an e-mail with a link that works for seven days.</p>
    <div class="card"><form onsubmit="return invite(event)">
      <div class="row"><div><label for="iname">Full name</label><input id="iname" type="text" required></div><div><label for="imail">Work e-mail</label><input id="imail" type="email" required></div></div>
      <div class="row"><div><label for="irole">Role</label><select id="irole"><option>Member</option><option>Admin</option><option>Billing</option></select></div><div></div></div>
      <label class="check"><input type="checkbox" id="iwelcome"> Send a welcome guide with the invitation</label>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn" onclick="location.hash='#/team'">Cancel</button><button class="btn primary" id="send">Send invitation</button></div>
    </form></div>`,
  billing: () => `<h2>Billing</h2><p class="sub">Plan and invoices.</p><div class="card"><b>Team plan</b><p style="color:#63716B;margin-top:6px">€12 per person and month. ${S.team.length} people: <b id="total">€${S.team.length * 12}.00 per month</b>.</p></div>`,
  settings: () => `<h2>Settings</h2><p class="sub">Organisation details.</p><div class="card"><label for="org">Organisation name</label><input id="org" type="text" value="Northwind Logistics"></div>`,
};
function invite(e) { e.preventDefault(); S.team.push({ n: iname.value, e: imail.value, r: irole.value, s: 'Invited' }); save(); location.hash = '#/team'; setTimeout(() => toast('Invitation sent to ' + S.team[S.team.length - 1].e), 80); return false; }
function boot() {
  const inn = !!S.user; document.getElementById('login').style.display = inn ? 'none' : 'flex'; document.getElementById('app').style.display = inn ? 'block' : 'none';
  if (!inn) return;
  const p = (location.hash.replace(/^#\//, '') || 'overview'); document.getElementById('who').textContent = S.user;
  document.getElementById('main').innerHTML = (pages[p] || pages.overview)(); document.getElementById('main').scrollTop = 0;
  document.querySelectorAll('aside a[data-p]').forEach(a => a.className = p.split('/')[0] === a.dataset.p ? 'on' : '');
}
addEventListener('hashchange', boot); boot();
</script>
</body></html>
